<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<title>Lead time for changes</title>
<desc>Number of changes by time from commit to running in production, grouped by DORA 2024 level.</desc>
<style>
svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --dim: #c3c2b7; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926; --dim: #4a4a46; }
}
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--ink-2); font-size: 12px; }
.title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.value { fill: var(--ink); font-variant-numeric: tabular-nums; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.ref { stroke: var(--ink-2); stroke-width: 1; }
</style>
<rect width="720" height="340" rx="8" fill="var(--surface)"/>
<text class="title" x="20" y="30">Lead time for changes</text>
<line class="grid" x1="48" x2="700" y1="276" y2="276"/>
<text class="tick" x="40" y="280" text-anchor="end">0</text>
<line class="grid" x1="48" x2="700" y1="221" y2="221"/>
<text class="tick" x="40" y="225" text-anchor="end">10</text>
<line class="grid" x1="48" x2="700" y1="166" y2="166"/>
<text class="tick" x="40" y="170" text-anchor="end">20</text>
<line class="grid" x1="48" x2="700" y1="111" y2="111"/>
<text class="tick" x="40" y="115" text-anchor="end">30</text>
<line class="grid" x1="48" x2="700" y1="56" y2="56"/>
<text class="tick" x="40" y="60" text-anchor="end">40</text>
<path fill="var(--s1)" d="M82.6,276 V274.5 Q82.6,270.5 86.6,270.5 H102.6 Q106.6,270.5 106.6,274.5 V276 Z"/>
<text class="value" x="94.6" y="264.5" text-anchor="middle">1</text>
<text class="tick" x="94.6" y="294" text-anchor="middle">&lt; 1 h</text>
<path fill="var(--s1)" d="M175.7,276 V87.5 Q175.7,83.5 179.7,83.5 H195.7 Q199.7,83.5 199.7,87.5 V276 Z"/>
<text class="value" x="187.7" y="77.5" text-anchor="middle">35</text>
<text class="tick" x="187.7" y="294" text-anchor="middle">1–4 h</text>
<path fill="var(--s1)" d="M268.9,276 V170 Q268.9,166 272.9,166 H288.9 Q292.9,166 292.9,170 V276 Z"/>
<text class="value" x="280.9" y="160" text-anchor="middle">20</text>
<text class="tick" x="280.9" y="294" text-anchor="middle">4–12 h</text>
<path fill="var(--s1)" d="M362,276 V164.5 Q362,160.5 366,160.5 H382 Q386,160.5 386,164.5 V276 Z"/>
<text class="value" x="374" y="154.5" text-anchor="middle">21</text>
<text class="tick" x="374" y="294" text-anchor="middle">12–24 h</text>
<path fill="var(--s1)" d="M455.1,276 V225 Q455.1,221 459.1,221 H475.1 Q479.1,221 479.1,225 V276 Z"/>
<text class="value" x="467.1" y="215" text-anchor="middle">10</text>
<text class="tick" x="467.1" y="294" text-anchor="middle">1–3 d</text>
<path fill="var(--s1)" d="M548.3,276 V274.5 Q548.3,270.5 552.3,270.5 H568.3 Q572.3,270.5 572.3,274.5 V276 Z"/>
<text class="value" x="560.3" y="264.5" text-anchor="middle">1</text>
<text class="tick" x="560.3" y="294" text-anchor="middle">3–7 d</text>

<text class="value" x="653.4" y="270" text-anchor="middle">0</text>
<text class="tick" x="653.4" y="294" text-anchor="middle">&gt; 7 d</text>
<line class="axis" x1="48" x2="700" y1="276" y2="276"/>
<path class="axis" fill="none" d="M52,304 V308 H416.6 V304"/>
<text x="234.3" y="324" text-anchor="middle">elite: under a day</text>
<path class="axis" fill="none" d="M424.6,304 V308 H602.9 V304"/>
<text x="513.7" y="324" text-anchor="middle">high: 1 day to 1 week</text>
<path class="axis" fill="none" d="M610.9,304 V308 H696 V304"/>
<text x="653.4" y="324" text-anchor="middle">medium or lower</text>
</svg>
