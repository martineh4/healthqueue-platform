# Prometheus, Alertmanager, Grafana and kube-state-metrics. Enforced at `baseline`, with
# `restricted` violations reported (warn/audit) so they stay visible. The application
# namespace enforces `restricted`.
# Why the difference: this stack is third-party software that changes with each chart
# upgrade. Today it passes `restricted` too (docs/evidence/phase-10-observability.md), but if
# an upgrade stopped passing, enforcing `restricted` would block monitoring from starting.
# Here such an upgrade is still admitted and the violation is reported instead.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
