# App of apps: applied by hand once, right after the AppProjects it depends on
# (deploy/scripts/bootstrap-cluster.sh). It syncs deploy/argocd, including this file and the
# projects, so from then on Git is the source of truth for every Application and AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/martineh4/healthqueue-platform.git
    targetRevision: main
    path: deploy/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # automated: apply merges without a manual step. prune: remove what was deleted from Git.
  # selfHeal: undo changes made directly in the cluster.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
