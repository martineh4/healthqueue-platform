apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthqueue-api
spec:
  # One replica and Recreate: SQLite on a ReadWriteOnce volume allows a single writer, so
  # the old pod must stop before the new one starts. Deploys therefore have a few seconds
  # of downtime, which counts against the availability SLO. PostgreSQL removes this
  # constraint (ADR-0005).
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  template:
    spec:
      serviceAccountName: healthqueue-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder; every overlay replaces it with registry/repository@sha256:digest.
          image: healthqueue-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: healthqueue-api-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # Startup allows up to 60 s for the first boot; after that liveness only restarts
          # a pod that has stopped answering, and readiness (which checks the database)
          # takes it out of the Service without restarting it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: healthqueue-data
        # The root filesystem is read-only; Python and SQLite may need scratch space.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
