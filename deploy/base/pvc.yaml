# Persistent disk for the SQLite database file, so appointments survive restarts and
# upgrades. ReadWriteOnce: exactly one pod may write (ADR-0005).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: healthqueue-data
  annotations:
    # Argo CD must never delete the database volume, even if this file disappears from
    # Git or the Application is deleted with cascade. Removing data is a manual decision.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
