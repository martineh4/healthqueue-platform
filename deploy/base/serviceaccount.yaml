apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthqueue-api
# The API never calls the Kubernetes API, so no token is mounted.
automountServiceAccountToken: false
# Created out of band by deploy/scripts/create-pull-secret.sh; never stored in Git (ADR-0004).
# On AKS this is unnecessary and should be removed: the kubelet identity pulls from ACR.
imagePullSecrets:
  - name: acr-pull
