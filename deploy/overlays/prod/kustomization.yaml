# Production: what Argo CD syncs to the cluster (phase 7). In plain terms: this file is the
# single, reviewed answer to "what exactly is running in production right now?"
#
# The image is pinned by digest
# to a release that release.yml built, scanned, signed and attested. release.yml proposes
# each new digest as a pull request (ADR-0007); keep the two lines under `images` in this
# shape, because .github/scripts/open-deploy-pr.sh rewrites them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthqueue

resources:
  - namespace.yaml
  - ../../base
  # Scrape config, SLO rules and alerts, dashboard (ADR-0008): versioned with the service.
  - ../../../observability

labels:
  - pairs:
      app.kubernetes.io/part-of: healthqueue
      app.kubernetes.io/environment: prod
    includeSelectors: false

images:
  - name: healthqueue-api
    newName: crhealthqueueora3w.azurecr.io/healthqueue-api
    # Release evidence: release-evidence/healthqueue-api/d9777c1d5a414dc8fab3819f109684f9c4fb6809/
    digest: sha256:877be23431ea4b647cf123be974d1107ef0884ecf541a07844b3accfd2965b9a
