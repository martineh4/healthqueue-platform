# Production: what Argo CD syncs to the cluster (phase 7). The image is pinned by digest
# to a release that release.yml built, scanned, signed and attested. release.yml proposes
# each new digest as a pull request (ADR-0007); keep the two lines under `images` in this
# shape, because .github/scripts/open-deploy-pr.sh rewrites them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthqueue

resources:
  - namespace.yaml
  - ../../base
  # Scrape config, SLO rules and alerts, dashboard (ADR-0008): versioned with the service.
  - ../../../observability

labels:
  - pairs:
      app.kubernetes.io/part-of: healthqueue
      app.kubernetes.io/environment: prod
    includeSelectors: false

images:
  - name: healthqueue-api
    newName: crhealthqueueora3w.azurecr.io/healthqueue-api
    # Release evidence: release-evidence/healthqueue-api/54e272af8c2208b5ed7917822e82e132a2d159d8/
    digest: sha256:afc9ef491e218c2701031aad1c967373e87e68ffad74284ec77288936f29a977
