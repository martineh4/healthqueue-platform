# The application's own namespace: a separate compartment in the cluster with its own
# security rules, so policies can be strict here without affecting other systems.
apiVersion: v1
kind: Namespace
metadata:
  name: healthqueue
  labels:
    # Pod Security Admission: reject any pod that does not meet the "restricted" profile
    # (non-root, no privilege escalation, dropped capabilities, seccomp).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
