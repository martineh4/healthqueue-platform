# Pull-request gate. Every job here is a required status check on `main`.
# Third-party actions are pinned to full commit SHAs (tag shown in the comment);
# see docs/supply-chain-slsa.md for why tag pinning is not enough.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  TRIVY_VERSION: v0.75.0
  IMAGE: healthqueue-api:ci-${{ github.sha }}

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.lock
            app/pyproject.toml

      - name: Install locked runtime deps + dev tools
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests with coverage gate
        run: pytest --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/coverage.xml
            app/junit.xml
          retention-days: 14

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

  repo-scan:
    name: repo-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Locked dependencies (CVEs), committed secrets, and IaC/Dockerfile misconfigurations.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  image-scan:
    name: image-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only; nothing is pushed from PRs. Publishing happens in release.yml.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          test "$(docker exec api id -u)" = "10001" || { echo "container must run as UID 10001"; exit 1; }
          if docker exec api python -m pip --version 2>/dev/null; then
            echo "runtime image must not ship pip"; exit 1
          fi
          docker logs api | head -5
          docker rm -f api

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image scan (SARIF report)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Matches the kind node image used for the cluster (phase 7).
      KUBERNETES_VERSION: 1.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned binaries verified against checksums recorded here, not fetched alongside them.
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "$KUSTOMIZE_SHA256  kustomize.tgz" | sha256sum --check --strict
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tgz" | sha256sum --check --strict
          tar -xzf kustomize.tgz -C "$RUNNER_TEMP/bin" kustomize
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render overlays
        run: |
          mkdir -p rendered
          for overlay in deploy/overlays/*/; do
            env=$(basename "$overlay")
            kustomize build "$overlay" > "rendered/$env.yaml"
            echo "rendered $env: $(grep -c '^kind:' "rendered/$env.yaml") objects"
          done

      - name: Validate against Kubernetes ${{ env.KUBERNETES_VERSION }} schemas
        run: kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" rendered/*.yaml

      # Deploy-by-digest is a supply-chain control (docs/supply-chain-slsa.md): a tag can be
      # repointed, a digest cannot.
      - name: Require digest-pinned images
        run: |
          if grep -nE '^\s*image:' rendered/*.yaml | grep -v '@sha256:[0-9a-f]\{64\}'; then
            echo "::error::every image must be pinned by @sha256 digest"; exit 1
          fi
          echo "all images pinned by digest"

      - name: Trivy misconfiguration scan (rendered manifests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: rendered
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
