# Pull-request gate. Every job here is a required status check on `main`.
#
# In plain terms: this is quality control before anything is accepted. No change reaches the
# main branch, and so no change can reach patients, until every check below passes on the
# exact code being proposed. It plays the role of a reviewed change-control record: what was
# proposed, what was tested, and the result, kept with the change.
#
#   lint-test    code style and the automated test suite (with a minimum coverage bar)
#   hadolint     the container recipe (Dockerfile) follows best practice
#   repo-scan    known-vulnerable libraries, accidentally committed passwords, risky config
#   image-scan   build the container, start it, and scan what would actually ship
#   manifests    the Kubernetes deployment files are valid, pinned and policy-compliant
#
# Third-party actions are pinned to full commit SHAs (tag shown in the comment). A tag such
# as v7 can be moved to different code by whoever controls it; a commit SHA cannot, so a
# compromised upstream project cannot change what runs here. See docs/supply-chain-slsa.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: by default every job can only read the repository. Jobs that need more
# ask for it individually, so a compromised step has as little power as possible.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run: only the latest code matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are fixed so a result can be reproduced later with the same tools.
env:
  PYTHON_VERSION: "3.13"
  TRIVY_VERSION: v0.75.0
  IMAGE: healthqueue-api:ci-${{ github.sha }}

jobs:
  # Why: tests catch regressions before review, and the 85% coverage floor (app/pyproject.toml)
  # stops untested code from slipping in. Dependencies install from a hash-locked file, so
  # the tests run against exactly the library versions that will ship.
  lint-test:
    name: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      # persist-credentials: false (here and below): the checkout's GitHub token is not left
      # on disk, so later steps (third-party tools included) cannot reuse it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.lock
            app/pyproject.toml

      - name: Install locked runtime deps + dev tools
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests with coverage gate
        run: pytest --cov-report=xml --junitxml=junit.xml

      # Phase 11: standard library only, linted with the tools installed above. The tests also
      # regenerate the data, report and charts and fail if the committed files differ.
      - name: DORA analysis (lint, tests, committed outputs current)
        working-directory: dora
        run: |
          ruff check --output-format=github .
          ruff format --check .
          python -m pytest -p no:cacheprovider

      # Kept for 14 days even when tests fail, so a failure can be investigated afterwards.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/coverage.xml
            app/junit.xml
          retention-days: 14

  # Why: catches container-recipe mistakes (unpinned packages, running as root, leftover
  # caches) that make images larger, less reproducible or less secure.
  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

  # Why: a leaked password or a library with a published, fixable vulnerability is cheapest
  # to stop before merge. HIGH and CRITICAL findings that already have a fix fail the check.
  # Findings with no fix published yet are skipped here, since no code change could clear
  # them; each release record counts them (release.yml) so they stay visible.
  repo-scan:
    name: repo-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Locked dependencies (CVEs), committed secrets, and IaC/Dockerfile misconfigurations.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Why: scanning the source is not enough; the container also contains an operating system
  # and Python itself. This job builds the real image, proves it starts and behaves (health
  # checks, non-root user, no package manager left inside), then scans that exact image.
  image-scan:
    name: image-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only; nothing is pushed from PRs. Publishing happens in release.yml.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/version | grep -q "\"commit\":\"$GITHUB_SHA\"" \
            || { echo "/version must report the build commit"; exit 1; }
          test "$(docker exec api id -u)" = "10001" || { echo "container must run as UID 10001"; exit 1; }
          if docker exec api python -m pip --version 2>/dev/null; then
            echo "runtime image must not ship pip"; exit 1
          fi
          docker logs api | head -5
          docker rm -f api

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image scan (SARIF report)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # Why: the files in deploy/ describe what runs in the cluster. This job renders them
  # exactly as Argo CD will, then checks they are valid Kubernetes, that every container
  # image is pinned to an unchangeable digest, that the alerting rules behave as tested, and
  # that our own workload passes a security-policy scan. A bad deployment file is caught in
  # review instead of in production.
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Matches the kind node image used for the cluster (phase 7).
      KUBERNETES_VERSION: 1.37.0
      CRDS_CATALOG_SHA: 501527ab9c40c827144c8f45945b25a023e344ce
      # Helm matches the version bundled with Argo CD v3.5.4, which renders deploy/monitoring.
      HELM_VERSION: v4.2.1
      HELM_SHA256: 479dca836e5b45e8bd222400c5591b0e3a647378f03ff96597180db97c17fdae
      # promtool matches the Prometheus image in deploy/monitoring/values.yaml.
      PROMETHEUS_VERSION: 3.15.0
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      KPS_CHART_VERSION: 92.3.0
      KPS_CHART_SHA256: 48399b911fa91b353e0c3d5e32c1cb7a67a168566549723553154ffd7be5d1fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned binaries verified against checksums recorded here, not fetched alongside them.
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "$KUSTOMIZE_SHA256  kustomize.tgz" | sha256sum --check --strict
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tgz" | sha256sum --check --strict
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum --check --strict
          curl -fsSLo prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "$PROMETHEUS_SHA256  prometheus.tgz" | sha256sum --check --strict
          tar -xzf kustomize.tgz -C "$RUNNER_TEMP/bin" kustomize
          tar -xzf kubeconform.tgz -C "$RUNNER_TEMP/bin" kubeconform
          tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          tar -xzf prometheus.tgz -C "$RUNNER_TEMP/bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The chart archive is verified here and unpacked where kustomize looks for it, so the
      # render uses exactly these bytes (kustomize skips the download when the chart exists).
      - name: Fetch and verify the kube-prometheus-stack chart
        run: |
          curl -fsSLo kps.tgz "https://github.com/prometheus-community/helm-charts/releases/download/kube-prometheus-stack-${KPS_CHART_VERSION}/kube-prometheus-stack-${KPS_CHART_VERSION}.tgz"
          echo "$KPS_CHART_SHA256  kps.tgz" | sha256sum --check --strict
          mkdir -p "deploy/monitoring/charts/kube-prometheus-stack-${KPS_CHART_VERSION}"
          tar -xzf kps.tgz -C "deploy/monitoring/charts/kube-prometheus-stack-${KPS_CHART_VERSION}"

      # rendered/app/ is ours and gets the full Trivy policy scan. Argo CD's upstream install
      # and the monitoring chart are validated and digest-checked but not policy-scanned:
      # their controllers need cluster-wide RBAC by design (ADR-0006, ADR-0008).
      - name: Render kustomizations
        run: |
          mkdir -p rendered/app
          for overlay in deploy/overlays/*/; do
            kustomize build "$overlay" > "rendered/app/$(basename "$overlay").yaml"
          done
          kustomize build deploy/argocd > rendered/gitops.yaml
          kustomize build deploy/argocd/install > rendered/argocd-install.yaml
          kustomize build --enable-helm deploy/monitoring > rendered/monitoring.yaml
          for f in rendered/app/*.yaml rendered/*.yaml; do
            echo "$f: $(grep -c '^kind:' "$f") objects"
          done

      # Argo CD Application/AppProject schemas come from the CRDs catalog at a pinned commit.
      # CRD definitions themselves have no published schema; the API server validates them.
      - name: Validate against Kubernetes ${{ env.KUBERNETES_VERSION }} schemas
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -skip CustomResourceDefinition \
            rendered/app/*.yaml rendered/*.yaml

      # Deploy-by-digest is a supply-chain control (docs/supply-chain-slsa.md): a tag can be
      # repointed, a digest cannot. This covers Argo CD's and the monitoring stack's images,
      # including images passed as operator flags. (`image:` with no value is a field name
      # inside a CRD schema, not an image.)
      - name: Require digest-pinned images
        run: |
          if grep -nE '^\s*image:\s*\S|^\s*- --[a-z-]*(image|reloader)=' rendered/app/*.yaml rendered/*.yaml \
              | grep -v '@sha256:[0-9a-f]\{64\}'; then
            echo "::error::every image must be pinned by @sha256 digest"; exit 1
          fi
          echo "all images pinned by digest:"
          grep -hoE '[a-z0-9.-]+/[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' rendered/app/*.yaml rendered/*.yaml | sort -u

      # Alerting rules are code: lint them, then run the unit tests that prove each alert
      # fires (and stays quiet) for the scenarios in observability/tests/slo.test.yaml.
      # yq ships with the GitHub-hosted runner image.
      - name: Test alerting rules (promtool)
        run: |
          mkdir -p rendered/rules
          yq '.spec' observability/prometheusrule.yaml > rendered/rules/healthqueue-api-slo.yaml
          yq '.spec' deploy/monitoring/platform-rules.yaml > rendered/rules/platform-gitops.yaml
          promtool check rules rendered/rules/*.yaml
          promtool test rules observability/tests/slo.test.yaml

      - name: Trivy misconfiguration scan (rendered manifests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: rendered/app
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
