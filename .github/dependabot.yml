# Weekly update proposals, each as a pull request that goes through the same CI gate as
# any other change. Nothing is updated without review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
  # The app image and the Codespace image are both pinned by digest; propose digest bumps.
  - package-ecosystem: docker
    directories: [/app, /.devcontainer]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  # infra/bootstrap only. infra/envs/prod is left out on purpose: Dependabot's updater runs
  # Terraform, which cannot parse that module's OpenTofu state `encryption` block ("Unsupported
  # block type"), so every run for it failed. Its provider updates are made by hand: bump the
  # constraint, run `tofu init -upgrade`, and review the plan on the pull request.
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule: { interval: weekly }
