version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: terraform
    directory: /infra/envs/prod
    schedule: { interval: weekly }
