# Weekly update proposals, each as a pull request that goes through the same CI gate as
# any other change. Nothing is updated without review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
  # The app image and the Codespace image are both pinned by digest; propose digest bumps.
  - package-ecosystem: docker
    directories: [/app, /.devcontainer]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  # Both OpenTofu root modules pin providers in a lock file.
  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/envs/prod]
    schedule: { interval: weekly }
