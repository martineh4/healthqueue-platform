# Tool configuration for the DORA analysis (phase 11). Standard library only, so there is
# nothing to install; CI runs it with the app's ruff and pytest (.github/workflows/ci.yml).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# S311: `random` drives a seeded simulation here, never anything security-related.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
