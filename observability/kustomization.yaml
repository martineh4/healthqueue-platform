# What HealthQueue ships to the monitoring stack: how to scrape it, its SLOs and alerts,
# and its dashboard. Included by deploy/overlays/prod, so the service's SLOs are versioned
# and deployed with the service (ADR-0008).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

# Grafana's sidecar loads ConfigMaps labelled grafana_dashboard=1 from any namespace.
configMapGenerator:
  - name: healthqueue-dashboards
    files:
      - dashboards/healthqueue-slo.json
    options:
      labels:
        grafana_dashboard: "1"
